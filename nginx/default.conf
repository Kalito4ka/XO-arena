server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Запросы API обрабатываются Apache с PHP
    location /api/ {
        # Docker может сменить IP PHP-контейнера при пересоздании.
        resolver 127.0.0.11 valid=5s;
        set $php_backend server:80;
        proxy_pass http://$php_backend;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PHP-файлы вне API не выдаются как обычный текст
    location ~* \.php(?:/|$) {
        return 404;
    }

    # HTML, CSS, JavaScript и изображения отдаёт Nginx
    location / {
        try_files $uri $uri/ =404;
    }
}
